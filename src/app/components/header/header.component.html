<header class="topbar">
    <div class="brand">
      <img src="../../assets/img/header/carpentry_logo.png" alt="Carpentry logo" />
      <span>CARPENTRY</span>
    </div>

    <nav class="desktop-nav">
      <a href="#inicio">Inicio</a>
      <a href="#galeria">Galería</a>
      <a href="#contacto">Contacto</a>
    </nav>

    <button class="menu-btn" (click)="toggleMenu()" aria-label="Abrir menú">
      <ion-icon [name]="menuOpen ? 'close-outline' : 'menu-outline'"></ion-icon>
    </button>
  </header>

  <div class="mobile-menu" [class.open]="menuOpen">
    <a href="#inicio" (click)="toggleMenu()">Inicio</a>
    <a href="#galeria" (click)="toggleMenu()">Galería</a>
    <a href="#contacto" (click)="toggleMenu()">Contacto</a>
  </div>
